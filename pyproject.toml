[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-mapwright"
version = "0.1.0"
description = "Generate osu! standard beatmaps from audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mapwright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
